<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wii</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <header>
      <div id="tabs" class="tabs"></div>
      <button id="session-manager-toggle" class="icon-btn header-icon-btn" title="Sessions" aria-label="Sessions">
        <img src="assets/icons/session-manager.svg" alt="" />
      </button>
      <button id="command-center-toggle" class="icon-btn header-icon-btn" title="Command Center (Ctrl+K)" aria-label="Command Center">
        <img src="assets/icons/command-center.svg" alt="" />
      </button>
    </header>

    <main id="timeline"></main>

    <section id="onboarding" aria-labelledby="onboarding-title">
      <div class="onboarding-card">
        <h1 id="onboarding-title">Start a session</h1>
        <p>Choose a project directory for Pi.</p>
        <button id="choose-project" type="button">Choose project directory</button>
        <p id="project-path" class="selected-path">No directory selected</p>
        <p id="provider-required" class="provider-required" hidden>Provider settings required before creating a session.</p>
        <button id="open-provider-settings" type="button" class="secondary" hidden>Open provider settings</button>
        <button id="create-session" type="button" disabled>Create session</button>
        <p id="onboarding-error" class="error"></p>
      </div>
    </section>

    <form id="composer" hidden>
      <div class="composer-controls">
        <div id="composer-project" class="composer-project"></div>
        <div class="composer-right">
          <div id="composer-stats" class="composer-stats"></div>
          <div class="composer-selects">
            <select id="composer-model" aria-label="Model"></select>
            <select id="composer-effort" aria-label="Reasoning effort">
              <option value="">Default</option>
              <option value="minimal">minimal</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
              <option value="max">Max</option>
            </select>
          </div>
        </div>
      </div>
      <div class="composer-input">
        <textarea id="message" rows="1" placeholder="Message…" required></textarea>
        <button id="composer-action" type="submit" class="composer-action" title="Send (Enter)" aria-label="Send">
          <span class="composer-hint">Enter ⏎</span>
          <img class="icon-stop" src="assets/icons/pause.svg" alt="" hidden />
        </button>
      </div>
    </form>

    <div id="command-center" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cc-title">
        <h1 id="cc-title" class="modal-title">
          <span id="cc-title-root" class="breadcrumb-link">Command Center</span><span id="cc-title-sub" class="breadcrumb-sub"></span>
        </h1>
        <div class="modal-search">
          <input id="cc-search" type="text" placeholder="Search commands…" autocomplete="off" />
          <img src="assets/icons/search.svg" alt="" />
        </div>
        <div id="cc-root" class="modal-body option-list">
          <button type="button" class="cc-item" data-panel="provider">
            <span>Providers</span><img src="assets/icons/link.svg" alt="" />
          </button>
          <button type="button" class="cc-item" data-panel="models">
            <span>Models</span><img src="assets/icons/search.svg" alt="" />
          </button>
          <button type="button" class="cc-item" data-panel="context">
            <span>Context Settings</span><img src="assets/icons/layers.svg" alt="" />
          </button>
        </div>

        <div id="cc-provider-panel" class="modal-body settings-panel" hidden>
          <form id="settings-form">
            <h2>OpenAI-compatible API</h2>
            <div class="row provider-bar">
              <label>Provider
                <select id="provider-select"></select>
              </label>
              <button type="button" id="provider-add-btn" class="secondary">+ New</button>
              <button type="button" id="provider-delete-btn" class="secondary">Delete</button>
            </div>
            <label>Name <input id="provider-name" value="Default" required /></label>
            <label>Base URL <input id="base-url" type="url" value="http://127.0.0.1:8317/v1" required /></label>
            <div class="row">
              <label>Model <input id="model" list="model-options" value="gemini-3.8-flash-high" required /></label>
              <button type="button" id="fetch-models">Fetch models</button>
            </div>
            <datalist id="model-options"></datalist>
            <p id="fetch-models-status" class="hint-text"></p>
            <label>Reasoning effort
              <select id="reasoning-effort">
                <option value="">Default</option><option value="minimal">Minimal</option><option value="low">Low</option>
                <option value="medium">Medium</option><option value="high">High</option><option value="xhigh">XHigh</option><option value="max">Max</option>
              </select>
            </label>
            <label>API key
              <div class="input-with-action">
                <input id="api-key" type="password" autocomplete="off" required />
                <button type="button" id="toggle-key" class="text-action" aria-label="Show key" aria-pressed="false">Show</button>
              </div>
            </label>
            <small>Stored in app data and reused for new sessions.</small>
            <button type="submit">Save</button>
            <p id="settings-error" class="error"></p>
          </form>
        </div>

        <div id="cc-models-panel" class="modal-body settings-panel" hidden>
          <p class="hint-text">Toggle which models appear in the composer dropdown.</p>
          <div id="models-list" class="models-list"></div>
        </div>

        <div id="cc-context-panel" class="modal-body settings-panel" hidden>
          <label>System prompt
            <textarea id="system-prompt" rows="12" placeholder="Leave empty to use pi's default coding assistant prompt"></textarea>
          </label>
          <button type="button" id="save-system-prompt">Save</button>
          <p id="system-prompt-status" class="hint-text"></p>
        </div>
      </div>
    </div>

    <div id="session-manager" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sm-title">
        <h1 id="sm-title" class="modal-title">Session Manager</h1>
        <div class="modal-search">
          <input id="sm-search" type="text" placeholder="Search sessions…" autocomplete="off" />
          <img src="assets/icons/search.svg" alt="" />
        </div>
        <div id="sm-list" class="modal-body sm-list" tabindex="-1"></div>
      </div>
    </div>
  </body>
</html>
